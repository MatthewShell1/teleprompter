<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Web</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030712;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    .version-nav {
      position: absolute;
      top: 0.75rem;
      left: 0.85rem;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.55rem;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .version-nav a {
      color: rgba(125, 211, 252, 0.55);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .version-nav a:hover {
      color: #7dd3fc;
    }

    .version-nav a.active {
      color: #e0f2fe;
      text-decoration: underline;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 50% 45%, rgba(56, 189, 248, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 20% 80%, rgba(168, 85, 247, 0.06) 0%, transparent 35%),
        linear-gradient(180deg, #020617 0%, #0f172a 50%, #020617 100%);
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, black 20%, transparent 75%);
      opacity: 0.7;
    }

    .scanline {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(56, 189, 248, 0.015) 2px,
        rgba(56, 189, 248, 0.015) 4px
      );
    }

    .hub-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      text-align: center;
      pointer-events: none;
    }

    .hub-label .ring {
      width: 88px;
      height: 88px;
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 50%;
      box-shadow:
        0 0 24px rgba(56, 189, 248, 0.35),
        inset 0 0 24px rgba(56, 189, 248, 0.12);
      animation: hubPulse 2s ease-in-out infinite;
    }

    .hub-label span {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #7dd3fc;
      white-space: nowrap;
    }

    @keyframes hubPulse {
      0%,
      100% {
        box-shadow:
          0 0 24px rgba(56, 189, 248, 0.35),
          inset 0 0 24px rgba(56, 189, 248, 0.12);
      }
      50% {
        box-shadow:
          0 0 40px rgba(168, 85, 247, 0.45),
          inset 0 0 30px rgba(56, 189, 248, 0.2);
      }
    }

    svg.web {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .link {
      stroke: url(#linkGradient);
      stroke-width: 1.2;
      fill: none;
      opacity: 0;
      filter: url(#glow);
    }

    .nodes {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .node {
      position: absolute;
      width: 148px;
      padding: 0.55rem 0.65rem;
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(6px);
      color: #e2e8f0;
      font-size: 0.68rem;
      line-height: 1.25;
      text-align: center;
      letter-spacing: 0.03em;
      box-shadow: 0 0 0 rgba(56, 189, 248, 0);
      will-change: transform, opacity, left, top;
    }

    .node::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.7), rgba(168, 85, 247, 0.4));
      mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      mask-composite: exclude;
      opacity: 0.5;
      pointer-events: none;
    }

    .node.settled {
      box-shadow:
        0 0 18px rgba(56, 189, 248, 0.25),
        0 0 36px rgba(168, 85, 247, 0.12);
    }

    .timer {
      position: absolute;
      right: 1.25rem;
      bottom: 1rem;
      z-index: 4;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(125, 211, 252, 0.55);
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <nav class="version-nav" aria-label="Animation versions">
      <a href="words.html" class="active">Original</a>
      <a href="words01.html">01</a>
      <a href="words02.html">02</a>
      <a href="words03.html">03</a>
    </nav>
    <div class="grid"></div>
    <div class="scanline"></div>

    <svg class="web" id="web" aria-hidden="true">
      <defs>
        <linearGradient id="linkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
          <stop offset="100%" stop-color="#a855f7" stop-opacity="0.7" />
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
      <g id="links"></g>
    </svg>

    <div class="hub-label" id="hub">
      <div class="ring"></div>
      <span>Knowledge</span>
    </div>

    <div class="nodes" id="nodes"></div>
    <div class="timer" id="timer">0.0s</div>
  </div>

  <script>
    (function () {
      "use strict";

      var phrases = [
        "Jokes to remember",
        "Family traditions",
        "Stories from relatives",
        "Home inventory",
        "Emergency preparedness",
        "Insurance policy details",
        "Vehicle maintenance history",
        "Retirement",
        "Quotes worth remembering",
        "Long-term goals",
        "Interview preparation",
        "Home improvement ideas",
        "Volunteer work",
        "Voting information",
        "Appliance manuals",
        "Warranty information",
        "Paint colors used in each room",
        "Air filter sizes",
      ];

      var scene = document.getElementById("scene");
      var nodesLayer = document.getElementById("nodes");
      var linksLayer = document.getElementById("links");
      var hub = document.getElementById("hub");
      var timerEl = document.getElementById("timer");

      function random(min, max) {
        return min + Math.random() * (max - min);
      }

      function getCenter() {
        return {
          x: scene.clientWidth / 2,
          y: scene.clientHeight / 2,
        };
      }

      function getOrbitRadius() {
        return Math.min(scene.clientWidth, scene.clientHeight) * 0.34;
      }

      function createLayout() {
        var center = getCenter();
        var radius = getOrbitRadius();
        var count = phrases.length;

        return phrases.map(function (phrase, index) {
          var angle = (index / count) * Math.PI * 2 - Math.PI / 2;
          return {
            phrase: phrase,
            targetX: center.x + Math.cos(angle) * radius,
            targetY: center.y + Math.sin(angle) * radius,
            startX: random(40, scene.clientWidth - 40),
            startY: random(40, scene.clientHeight - 40),
            startRotation: random(-28, 28),
          };
        });
      }

      function buildNodes(layout) {
        nodesLayer.innerHTML = "";
        linksLayer.innerHTML = "";

        return layout.map(function (item, index) {
          var node = document.createElement("div");
          node.className = "node";
          node.textContent = item.phrase;
          node.style.left = item.startX + "px";
          node.style.top = item.startY + "px";
          nodesLayer.appendChild(node);

          gsap.set(node, {
            xPercent: -50,
            yPercent: -50,
            rotation: item.startRotation,
            scale: 0.55,
            opacity: 0,
          });

          var center = getCenter();
          var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("class", "link");
          line.setAttribute("x1", center.x);
          line.setAttribute("y1", center.y);
          line.setAttribute("x2", item.startX);
          line.setAttribute("y2", item.startY);
          linksLayer.appendChild(line);

          var neighbor = layout[(index + 1) % layout.length];
          var ring = document.createElementNS("http://www.w3.org/2000/svg", "line");
          ring.setAttribute("class", "link ring-link");
          ring.setAttribute("x1", item.targetX);
          ring.setAttribute("y1", item.targetY);
          ring.setAttribute("x2", neighbor.targetX);
          ring.setAttribute("y2", neighbor.targetY);
          linksLayer.appendChild(ring);

          return {
            el: node,
            hubLine: line,
            ringLine: ring,
            data: item,
          };
        });
      }

      function animateSequence() {
        var layout = createLayout();
        var nodes = buildNodes(layout);
        var center = getCenter();

        gsap.set(hub, { opacity: 0, scale: 0.6 });
        gsap.set(timerEl, { opacity: 0 });

        var tl = gsap.timeline({
          defaults: { ease: "power3.inOut" },
          onUpdate: function () {
            timerEl.textContent = tl.time().toFixed(1) + "s";
          },
        });

        tl.to(timerEl, { opacity: 1, duration: 0.3 }, 0);

        nodes.forEach(function (node, index) {
          var stagger = index * 0.04;

          tl.to(
            node.el,
            {
              opacity: 1,
              scale: 0.85,
              duration: 0.45,
            },
            stagger
          );

          tl.to(
            node.el,
            {
              duration: 4.8,
              left: node.data.targetX,
              top: node.data.targetY,
              rotation: 0,
              scale: 1,
              ease: "power4.inOut",
            },
            1.2 + stagger * 0.5
          );

          tl.to(
            node.hubLine,
            {
              attr: { x2: node.data.targetX, y2: node.data.targetY },
              opacity: 0.85,
              duration: 4.5,
              ease: "power2.inOut",
            },
            1.4 + stagger * 0.35
          );

          tl.to(
            node.ringLine,
            {
              opacity: 0.45,
              duration: 2.2,
              ease: "sine.inOut",
            },
            5.4 + index * 0.03
          );

          tl.add(function () {
            node.el.classList.add("settled");
          }, 6.8);
        });

        tl.to(
          hub,
          {
            opacity: 1,
            scale: 1,
            duration: 1.2,
            ease: "back.out(1.4)",
          },
          5.8
        );

        tl.to(
          ".node",
          {
            boxShadow: "0 0 22px rgba(56, 189, 248, 0.35), 0 0 44px rgba(168, 85, 247, 0.18)",
            duration: 0.8,
            ease: "sine.inOut",
          },
          7.1
        );

        tl.to(
          scene,
          {
            backgroundColor: "#041018",
            duration: 0.9,
          },
          7.2
        );

        tl.to({}, { duration: 0.1 }, 8);
      }

      window.addEventListener("load", animateSequence);
      window.addEventListener("resize", function () {
        gsap.globalTimeline.clear();
        animateSequence();
      });
    })();
  </script>
</body>
</html>
