<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleprompter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app" class="d-flex flex-column vh-100">
    <!-- Control panel -->
    <header id="controls" class="controls-panel">
      <div class="container-fluid py-2">
        <div class="row g-2 align-items-center">
          <div class="col-auto">
            <h1 class="h5 mb-0 text-light"><i class="bi bi-camera-video me-1"></i>Teleprompter</h1>
          </div>

          <div class="col-auto ms-auto d-flex flex-wrap gap-2">
            <button id="btn-play" class="btn btn-success btn-sm" title="Play / Pause">
              <i class="bi bi-play-fill"></i> Play
            </button>
            <button id="btn-reset" class="btn btn-outline-light btn-sm" title="Reset to top">
              <i class="bi bi-skip-start-fill"></i> Reset
            </button>
            <button id="btn-fullscreen" class="btn btn-outline-light btn-sm" title="Toggle fullscreen">
              <i class="bi bi-fullscreen"></i>
            </button>
            <button id="btn-hide-controls" class="btn btn-outline-secondary btn-sm" title="Hide controls">
              <i class="bi bi-chevron-up"></i>
            </button>
          </div>
        </div>

        <div class="row g-2 mt-1">
          <div class="col-12">
            <label for="wiki-url" class="form-label form-label-sm text-secondary mb-1">
              Load from MediaWiki
            </label>
            <div class="input-group input-group-sm wiki-load-group">
              <span class="input-group-text"><i class="bi bi-wikipedia"></i></span>
              <input
                type="url"
                id="wiki-url"
                class="form-control"
                value="https://k.mshell.net/index.php?title=WikiFam_Video1_Teleprompt"
                placeholder="https://k.mshell.net/index.php?title=Page_Title"
                autocomplete="off"
              >
              <button id="btn-load-wiki" class="btn btn-primary" type="button">
                <i class="bi bi-cloud-download"></i> Load
              </button>
            </div>
            <div id="wiki-status" class="wiki-status text-secondary" aria-live="polite"></div>
          </div>
        </div>

        <div class="row g-2 mt-1">
          <div class="col-lg-4 col-md-6">
            <label for="script-input" class="form-label form-label-sm text-secondary mb-1">Script</label>
            <textarea id="script-input" class="form-control form-control-sm script-input" rows="3" placeholder="Paste or type your script here…">Welcome to your teleprompter.

Edit this text in the script box above, then press Play to start scrolling.

Adjust font, size, and speed using the controls below. Use the flip options when reading from a mirror setup.</textarea>
          </div>

          <div class="col-lg-8 col-md-6">
            <div class="row g-2">
              <div class="col-sm-6 col-md-4">
                <label for="font-family" class="form-label form-label-sm text-secondary mb-1">Font style</label>
                <select id="font-family" class="form-select form-select-sm">
                  <option value="'Segoe UI', system-ui, sans-serif">Segoe UI</option>
                  <option value="Georgia, 'Times New Roman', serif">Georgia</option>
                  <option value="'Courier New', Courier, monospace">Courier New</option>
                  <option value="Arial, Helvetica, sans-serif">Arial</option>
                  <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
                  <option value="Verdana, Geneva, sans-serif">Verdana</option>
                  <option value="Impact, Haettenschweiler, sans-serif">Impact</option>
                </select>
              </div>

              <div class="col-sm-6 col-md-4">
                <label for="font-size" class="form-label form-label-sm text-secondary mb-1">
                  Text size <span id="font-size-value" class="text-light">48</span>px
                </label>
                <input type="range" id="font-size" class="form-range" min="16" max="120" value="48">
              </div>

              <div class="col-sm-6 col-md-4">
                <label for="text-width" class="form-label form-label-sm text-secondary mb-1">
                  Text width <span id="text-width-value" class="text-light">90</span>%
                </label>
                <input type="range" id="text-width" class="form-range" min="30" max="100" value="90">
              </div>

              <div class="col-sm-6 col-md-4">
                <label class="form-label form-label-sm text-secondary mb-1">Crawl speed</label>
                <div class="input-group input-group-sm speed-control">
                  <button id="btn-speed-down" type="button" class="btn btn-outline-light" title="Decrease crawl speed" aria-label="Decrease crawl speed">
                    <i class="bi bi-dash-lg"></i>
                  </button>
                  <span id="speed-value" class="form-control speed-value text-light" aria-live="polite">25</span>
                  <button id="btn-speed-up" type="button" class="btn btn-outline-light" title="Increase crawl speed" aria-label="Increase crawl speed">
                    <i class="bi bi-plus-lg"></i>
                  </button>
                </div>
              </div>

              <div class="col-sm-6 col-md-4">
                <label class="form-label form-label-sm text-secondary mb-1 d-block">Flip display</label>
                <div class="btn-group btn-group-sm w-100" role="group">
                  <input type="checkbox" class="btn-check" id="flip-horizontal" autocomplete="off">
                  <label class="btn btn-outline-light" for="flip-horizontal" title="Mirror left-right">
                    <i class="bi bi-arrow-left-right"></i> Left–Right
                  </label>
                  <input type="checkbox" class="btn-check" id="flip-vertical" autocomplete="off">
                  <label class="btn btn-outline-light" for="flip-vertical" title="Flip top-bottom">
                    <i class="bi bi-arrow-down-up"></i> Top–Bottom
                  </label>
                </div>
              </div>

              <div class="col-sm-6 col-md-4">
                <label for="text-color" class="form-label form-label-sm text-secondary mb-1">Text color</label>
                <input type="color" id="text-color" class="form-control form-control-color form-control-sm w-100" value="#ffffff">
              </div>

              <div class="col-sm-6 col-md-4">
                <label for="bg-color" class="form-label form-label-sm text-secondary mb-1">Background</label>
                <input type="color" id="bg-color" class="form-control form-control-color form-control-sm w-100" value="#000000">
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Show controls tab (visible when panel hidden) -->
    <button id="btn-show-controls" class="show-controls-tab d-none" title="Show controls">
      <i class="bi bi-sliders"></i>
    </button>

    <!-- Prompter viewport -->
    <main id="prompter-viewport" class="prompter-viewport flex-grow-1 position-relative overflow-hidden">
      <div id="reading-guide" class="reading-guide" aria-hidden="true"></div>
      <div id="prompter-stage" class="prompter-stage">
        <div id="prompter-content" class="prompter-content"></div>
      </div>
    </main>
  </div>

  <script src="js/mediawiki.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
